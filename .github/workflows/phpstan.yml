name: phpstan

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/phpstan.yml'
  pull_request:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/phpstan.yml'

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      # There is deliberately NO `restore-keys` here. PHPStan keeps its DI
      # container cache in this directory, so a partial-key restore hands back a
      # container built under different conditions and reuses it indefinitely.
      # That surfaced as `Undefined constant Larastan\Larastan\LARAVEL_VERSION`,
      # thrown from an extension before any analysis, on a tree that analysed
      # clean from a cold cache — and it survived every push whose key did not
      # change, because the poisoned cache kept being restored onto itself.
      #
      # A key miss must therefore mean a COLD cache, never an older one: a cold
      # result cache only costs time, while a foreign container costs a red
      # build nobody can reproduce locally. The epoch invalidates every cache
      # saved before this rule existed; bump it if the container is ever
      # poisoned again.
      - name: Cache PHPStan results
        uses: actions/cache@v6
        with:
          path: .cache/phpstan/
          key: phpstan-v2-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --no-interaction --memory-limit=2G
