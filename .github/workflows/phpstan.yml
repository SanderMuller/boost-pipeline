name: phpstan

permissions:
  contents: read

on:
  push:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/phpstan.yml'
  pull_request:
    paths:
      - '**.php'
      - 'phpstan.neon.dist'
      - 'phpstan-baseline.neon'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/phpstan.yml'

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      # The epoch is what makes a stale cache droppable. PHPStan keeps its DI
      # container cache in this directory, and `restore-keys` will hand back an
      # older cache on a key miss — so a container built under different
      # conditions was reused indefinitely. It surfaced as
      # `Undefined constant Larastan\Larastan\LARAVEL_VERSION`, thrown from a
      # lazily built extension before any analysis, on a tree that analysed
      # clean from a cold cache. Bump the epoch to invalidate every cache below
      # it.
      - name: Cache PHPStan results
        uses: actions/cache@v6
        with:
          path: .cache/phpstan/
          key: phpstan-v2-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}
          restore-keys: phpstan-v2-

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --no-interaction --memory-limit=2G
